name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  # Compile against the committed query cache rather than a live database.
  #
  # This is why CI was failing: `sqlx::query!` verifies each query at compile
  # time, and without this it tried to verify against the CI Postgres — which
  # exists but has no schema, because nothing applied the migrations. Every
  # macro then failed to resolve a type, producing 44 errors that all looked
  # like unrelated Rust problems. It built locally only because dotenvy picked
  # up a DATABASE_URL pointing at a developer's already-migrated database.
  #
  # Offline is also what the Docker build uses, so CI now compiles the same way
  # the shipped image does.
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tidasone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Submodules are deliberately not fetched. liboqs and liboqs-python are
      # ~570 MB and nothing in the Rust build references them — the
      # post-quantum primitives come from the pqcrypto-* crates. Fetching them
      # cost several minutes a run for nothing.
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting of the migration set
        run: |
          echo "migrations: $(ls packages/db/migrations/*.sql | wc -l)"

      - name: Build
        run: cargo build --workspace --verbose

      - name: Unit tests
        run: cargo test --lib --verbose

      - name: Apply migrations
        env:
          PGPASSWORD: password
        run: |
          # Applied twice on purpose. Migrations run on every container start,
          # so one that is not re-runnable breaks every deploy after the first
          # — and that is invisible to a single pass on an empty database.
          # Two unguarded statements were found exactly this way.
          for pass in 1 2; do
            echo "--- pass $pass ---"
            for f in packages/db/migrations/*.sql; do
              psql -h localhost -U postgres -d tidasone_test -v ON_ERROR_STOP=1 -q -f "$f" \
                || { echo "FAILED on $(basename "$f") during pass $pass"; exit 1; }
            done
          done
          echo "migrations are re-runnable"

      - name: Integration tests
        # TEST_DATABASE_URL is what makes these run at all: without it they
        # skip silently, so CI would report green while one organisation could
        # read another's inventory. The boundary suite found two real leaks the
        # first time it ran.
        #
        # Named individually rather than via `--tests` so that a suite being
        # accidentally removed shows up as a missing target instead of as one
        # fewer line of output nobody reads.
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/tidasone_test
        run: |
          cargo test --test boundaries --verbose
          cargo test --test dtn_replay --verbose
          cargo test --test chat_people --verbose
          cargo test --test replication --verbose
