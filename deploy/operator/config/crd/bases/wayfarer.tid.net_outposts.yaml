apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: outposts.wayfarer.tid.net
spec:
  group: wayfarer.tid.net
  names:
    kind: Outpost
    listKind: OutpostList
    plural: outposts
    singular: outpost
    shortNames:
      - op
      - outpost
    categories:
      - wayfarer
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Role
          type: string
          jsonPath: .spec.role
        - name: Body
          type: integer
          jsonPath: .spec.bodyId
        - name: Region
          type: string
          jsonPath: .spec.region
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: Outpost is one tid-wayfarer deployment (API + optional embedded Postgres) that syncs with the mesh.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                role:
                  type: string
                  enum: [core, outpost]
                  default: outpost
                bodyId:
                  type: integer
                  format: int32
                  default: 399
                region:
                  type: string
                replicas:
                  type: integer
                  format: int32
                  minimum: 1
                  default: 1
                secretName:
                  type: string
                migrate:
                  type: boolean
                  default: true
                image:
                  type: object
                  properties:
                    repository:
                      type: string
                      default: tid-wayfarer
                    tag:
                      type: string
                      default: latest
                    pullPolicy:
                      type: string
                      default: IfNotPresent
                peers:
                  type: object
                  properties:
                    coreApiUrl:
                      type: string
                    fabricAuth:
                      type: string
                      enum:
                      - both
                      - signed
                      - legacy
                      default: both
                postgres:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    image:
                      type: string
                      default: postgres:16-alpine
                    user:
                      type: string
                      default: postgres
                    database:
                      type: string
                      default: tidasone
                    storageSize:
                      type: string
                      default: 5Gi
                    storageClass:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                readyReplicas:
                  type: integer
                  format: int32
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
