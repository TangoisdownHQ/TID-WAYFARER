apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tid-wayfarer.fullname" . }}-api
  labels:
    {{- include "tid-wayfarer.labels" . | nindent 4 }}
    wayfarer.tid.net/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tid-wayfarer.selectorLabels" . | nindent 6 }}
      wayfarer.tid.net/component: api
  template:
    metadata:
      labels:
        {{- include "tid-wayfarer.selectorLabels" . | nindent 8 }}
        wayfarer.tid.net/component: api
    spec:
      {{- if .Values.keys.enabled }}
      volumes:
      - name: keys
        persistentVolumeClaim:
          claimName: {{ include "tid-wayfarer.fullname" . }}-keys
      {{- end }}
      containers:
      - name: api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: {{ include "tid-wayfarer.fullname" . }}-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "tid-wayfarer.fullname" . }}-secret
              key: POSTGRES_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "tid-wayfarer.fullname" . }}-secret
              key: JWT_SECRET
        # Fabric-wide shared secret; must match on every outpost that syncs.
        # Under fabricAuth=signed this is only a bootstrap credential for
        # /api/nodes/register — peers authenticate with per-node signatures.
        - name: NODE_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "tid-wayfarer.fullname" . }}-secret
              key: NODE_SHARED_SECRET
        - name: FABRIC_AUTH
          value: {{ .Values.fabricAuth | default "both" | quote }}
        - name: DATABASE_URL
          value: {{ include "tid-wayfarer.databaseUrl" . | quote }}
        {{- if .Values.keys.enabled }}
        volumeMounts:
        - name: keys
          mountPath: /app/keys
        {{- end }}
        startupProbe:
          httpGet:
            path: {{ .Values.probes.startup.path }}
            port: http
          failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          periodSeconds: {{ .Values.probes.startup.periodSeconds }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path }}
            port: http
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readiness.path }}
            port: http
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
        resources:
          {{- toYaml .Values.resources.api | nindent 10 }}
